name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: yomiyasu を取ってくる
        run: git clone --depth 1 https://github.com/nanaism/yomiyasu.git "$RUNNER_TEMP/yomiyasu"
      - name: テスト
        env:
          NIHONGO_YOMIYASU_DIR: ${{ runner.temp }}/yomiyasu/skills/yomiyasu
        run: python -m unittest discover tests -v
